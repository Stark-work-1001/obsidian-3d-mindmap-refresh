[package]
name = "graph-physics"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "Force-directed 3D layout engine for outline mind maps (WebAssembly, SIMD)"
publish = false

[package.metadata.wasm-pack.profile.release]
# wasm-opt is skipped by the build script (--no-opt) so builds do not depend on
# binaryen being installed; the Rust release profile already optimises.
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# glam: SIMD-aligned Vec3A (16 bytes) matches the stride-4 Float32Array layout.
glam = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
